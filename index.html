<!DOCTYPE html>

<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ola ♥</title>

    <style>

:root {
    color-scheme: dark;
    --ink: #09030a;
    --ink-soft: #160713;
    --plum: #321027;
    --pink-light: #ffd0e2;
    --pink: #ff69b4;
    --pink-hot: #ff2f92;
    --pink-deep: #b51d68;
    --rose-glass: rgba(255, 105, 180, .14);
    --gold: #ffd98a;
    --white: #fff8fc;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --ease-spring: cubic-bezier(.2, 1.35, .4, 1);
    --frame-radius: 30px;
    --frame-width:  min( min(440px, 90vw), 100% );
    --frame-height: min(580px, 84vh);
    --shadow-deep: 0 32px 90px rgba(0,0,0,.72);
    --shadow-pink: 0 0 70px rgba(255,47,146,.22);
}

*, *::before, *::after { box-sizing: border-box; }
html { min-height: 100%; background: var(--ink); }
body {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    overflow: hidden;
    display: grid;
    place-items: center;
    isolation: isolate;
    color: var(--white);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
        radial-gradient(ellipse at 50% 42%, rgba(111,20,72,.42), transparent 48%),
        radial-gradient(ellipse at 12% 90%, rgba(255,47,146,.12), transparent 36%),
        radial-gradient(ellipse at 90% 8%, rgba(255,217,138,.08), transparent 30%),
        linear-gradient(145deg, #10050e 0%, #09030a 55%, #160611 100%);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}
body::before, body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
}
body::before {
    opacity: .55;
    background-image: radial-gradient(rgba(255,220,238,.22) .65px, transparent .65px);
    background-size: 34px 34px;
    mask-image: linear-gradient(to bottom, transparent, #000 25%, #000 75%, transparent);
}
body::after {
    box-shadow: inset 0 0 18vw rgba(0,0,0,.62);
    background: linear-gradient(115deg, rgba(255,255,255,.018), transparent 35%, transparent 70%, rgba(255,105,180,.025));
}
#bg-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
}
#envelope-container {
    position: absolute;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .8s var(--ease-spring), opacity .7s ease, filter .7s ease;
    filter: drop-shadow(0 24px 45px rgba(255,47,146,.16));
}
#envelope-container:hover { transform: translateY(-9px) scale(1.045); }
#envelope-container:active { transform: translateY(-2px) scale(.985); }
.envelope {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 360px;
    height: 240px;
    overflow: visible;
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 17px;
    background: linear-gradient(145deg, #ff9dbd 0%, #ff548e 48%, #d92770 100%);
    box-shadow: 0 30px 65px rgba(0,0,0,.42), 0 12px 45px rgba(255,47,146,.25), inset 0 1px rgba(255,255,255,.5);
    transform-style: preserve-3d;
    perspective: 1100px;
}
.envelope::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(255,255,255,.22), transparent 42%, rgba(100,0,40,.14));
    pointer-events: none;
}
.envelope::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 58%;
    border-radius: 0 0 16px 16px;
    background: linear-gradient(145deg, transparent 49.5%, rgba(150,0,55,.2) 50%);
    pointer-events: none;
}
.envelope-flap {
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-left: 180px solid transparent;
    border-right: 180px solid transparent;
    border-top: 137px solid #ff76a4;
    transform-origin: top center;
    transition: transform .85s var(--ease-out), filter .85s ease;
    filter: drop-shadow(0 7px 10px rgba(90,0,35,.18));
    z-index: 4;
    backface-visibility: hidden;
}
.envelope.open .envelope-flap { transform: rotateX(180deg); z-index: 1; }
.wax-seal {
    position: absolute;
    top: 100px;
    z-index: 5;
    display: grid;
    place-items: center;
    width: 70px; height: 70px;
    border: 2px solid rgba(255,220,230,.8);
    border-radius: 50%;
    color: #fff4f8;
    font-size: 28px;
    background: radial-gradient(circle at 32% 25%, #ff8eae, #ed245f 54%, #810c37 100%);
    box-shadow: 0 9px 25px rgba(0,0,0,.4), inset 0 3px 7px rgba(255,255,255,.45), inset 0 -5px 10px rgba(80,0,30,.35);
}
.envelope-text {
    margin-top: 34px;
    color: var(--pink-light);
    font-size: 1.08rem;
    font-weight: 650;
    letter-spacing: .18em;
    text-transform: uppercase;
    text-shadow: 0 3px 18px rgba(255,47,146,.5);
    animation: invitation-breathe 2.6s ease-in-out infinite;
}
@keyframes invitation-breathe {
    0%,100% { opacity: .76; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-3px); }
}
#main-scene {
    position: relative;
    z-index: 10;
    display: none;
    place-items: center;
    width: 100vw;
    width: 100svw;
    height: 100vh;
    height: 100svh;
    opacity: 0;
    transition: opacity 1.25s ease;
}
#main-scene.visible { display: grid; opacity: 1; }
.photo-frame {
    position: relative;
    isolation: isolate;
    width: var(--frame-width);
    height: var(--frame-height);
    overflow: hidden;
    border: 1px solid rgba(255,190,220,.55);
    border-radius: var(--frame-radius);
    background: #10050d;
    box-shadow: var(--shadow-deep), var(--shadow-pink), inset 0 1px rgba(255,255,255,.28);
    transform: translateZ(0);
    transition: border-color .7s ease, box-shadow .7s ease, border-radius .7s ease;
}
.photo-frame:hover {
    border-color: rgba(255,220,235,.82);
    box-shadow: 0 38px 100px rgba(0,0,0,.78), 0 0 90px rgba(255,47,146,.3), inset 0 1px rgba(255,255,255,.35);
}
.photo-frame img {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
    opacity: 0;
    visibility: hidden;
    transform: scale(1.075);
    filter: brightness(.91) contrast(1.07) saturate(1.1);
    transition: opacity 1.15s cubic-bezier(.22,.61,.36,1), transform 7s cubic-bezier(.16,1,.3,1), filter 1.1s ease, visibility 1.15s;
    will-change: opacity, transform;
}
.photo-frame img.active {
    z-index: 2;
    opacity: 1;
    visibility: visible;
    transform: scale(1);
    animation: image-drift 8s ease-in-out forwards;
}
@keyframes image-drift {
    from { transform: scale(1); }
    to { transform: scale(1.075); }
}
.photo-frame::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: inherit;
    background: radial-gradient(ellipse at center, transparent 48%, rgba(7,0,5,.12) 76%, rgba(7,0,5,.48) 100%);
    box-shadow: inset 0 0 35px rgba(255,105,180,.08), inset 0 -45px 70px rgba(0,0,0,.16);
}
.photo-frame::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    border-radius: inherit;
    background: linear-gradient(130deg, rgba(255,255,255,.11), transparent 24%, transparent 72%, rgba(255,105,180,.07));
    mix-blend-mode: screen;
}
.film-grain {
    position: absolute;
    inset: 0;
    z-index: 6;
    width: 100%; height: 100%;
    pointer-events: none;
    opacity: .11;
    mix-blend-mode: soft-light;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
    background-size: 180px 180px;
}
.my-girl-text {
    position: absolute;
    z-index: 8;
    color: #fff;
    font-family: Impact, "Arial Black", sans-serif;
    font-weight: 900;
    letter-spacing: -.055em;
    line-height: .95;
    text-transform: lowercase;
    user-select: none;
    opacity: 0;
    visibility: hidden;
    transform: scale(.35) rotate(-9deg);
    text-shadow: 2px 3px 0 rgba(0,0,0,.75), 0 8px 24px rgba(0,0,0,.35);
    -webkit-font-smoothing: antialiased;
    pointer-events: none;
}
.my-girl-text.is-visible {
    visibility: visible;
    animation: text-arrive .85s var(--ease-spring) both;
}
.my-girl-text:hover { transform: scale(1.1) rotate(0deg); }
@keyframes text-arrive {
    0% { opacity: 0; transform: scale(.35) rotate(-9deg); }
    72% { opacity: 1; transform: scale(1.08) rotate(var(--rot,0deg)); }
    100% { opacity: 1; transform: scale(1) rotate(var(--rot,0deg)); }
}
.mg-1 { top: 30%; left: 6%; font-size: 1.5rem; --rot: -6deg; }
.mg-2 { top: 42%; left: 2%; font-size: 2.2rem; color: #ffeb3b; --rot: 3deg; }
.mg-3 { top: 51%; left: 4%; font-size: 1.3rem; --rot: -2deg; }
.mg-4 { top: 33%; right: 20%; font-size: 1.9rem; --rot: 4deg; }
.mg-5 { top: 41%; right: 26%; font-size: 1.4rem; color: #00ffff; --rot: -4deg; }
.mg-6 { top: 47%; right: 8%; font-size: 2.5rem; --rot: 2deg; }
.mg-7 { top: 56%; right: 22%; font-size: 1.6rem; color: #ff99bb; --rot: -3deg; }

/* Dodatkowe gotowe warianty prezentacji zdjęć. */
.photo-frame.is-cinematic img.active { filter: brightness(.82) contrast(1.18) saturate(.94); }
.photo-frame.is-warm img.active { filter: brightness(.96) contrast(1.04) saturate(1.12) sepia(.09); }
.photo-frame.is-rose img.active { filter: brightness(.94) contrast(1.05) saturate(1.16) hue-rotate(-7deg); }
.photo-frame.is-dream img.active { filter: brightness(1.02) contrast(.98) saturate(1.08); }
.photo-frame.is-vivid img.active { filter: brightness(.98) contrast(1.16) saturate(1.3); }
.photo-frame.is-matte img.active { filter: brightness(.94) contrast(.92) saturate(.88); }
.photo-frame.is-noir img.active { filter: grayscale(1) contrast(1.12) brightness(.88); }
.photo-frame.is-soft img.active { filter: brightness(1.02) contrast(.96) saturate(1.02); }
.photo-frame.is-zoom img.active { animation: image-drift 10s ease-in-out forwards; }
.photo-frame.is-static img.active { animation: none; transform: none; }
.photo-frame.is-rounded { border-radius: 42px; }
.photo-frame.is-square { border-radius: 8px; }
.photo-frame.is-glass { border-color: rgba(255,255,255,.68); backdrop-filter: blur(2px); }
.photo-frame.is-gold { border-color: rgba(255,217,138,.75); box-shadow: var(--shadow-deep), 0 0 75px rgba(255,217,138,.18); }
.photo-frame.is-neon { box-shadow: var(--shadow-deep), 0 0 18px rgba(255,47,146,.34), 0 0 85px rgba(255,47,146,.25); }
.photo-frame.is-minimal { box-shadow: 0 22px 65px rgba(0,0,0,.72); }
.photo-frame.is-vignette::before { background: radial-gradient(ellipse, transparent 35%, rgba(0,0,0,.58) 100%); }
.photo-frame.is-bright::before { background: linear-gradient(180deg, rgba(255,255,255,.08), transparent 30%, rgba(0,0,0,.08)); }
.photo-frame.is-grainy .film-grain { opacity: .2; }
.photo-frame.is-clean .film-grain { opacity: 0; }
.photo-frame.is-glow::after { box-shadow: inset 0 0 55px rgba(255,105,180,.18); }
.photo-frame.is-muted img.active { filter: saturate(.72) brightness(.9) contrast(1.02); }
.photo-frame.is-luminous img.active { filter: saturate(1.12) brightness(1.06) contrast(1.04); }
.photo-frame.is-fade img { transition-duration: 1.8s; }
.photo-frame.is-fast img { transition-duration: .55s; }
.photo-frame.is-slow img { transition-duration: 1.8s; }
.photo-frame.is-landscape { width: min(820px, 92vw); height: min(520px, 78vh); }
.photo-frame.is-portrait { width: min(440px, 90vw); height: min(680px, 88vh); }
.photo-frame.is-wide { width: min(1000px, 94vw); height: min(560px, 78vh); }
.photo-frame.is-compact { width: min(360px, 88vw); height: min(480px, 78vh); }

/* Klasy dekoracyjne do ewentualnego dalszego rozwijania strony. */
.glass-surface { background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(18px); }
.text-gradient { color: transparent; background: linear-gradient(100deg, #fff1f7, #ff75b7 55%, #ffd98a); background-clip: text; -webkit-background-clip: text; }
.neon-text { text-shadow: 0 0 8px rgba(255,105,180,.8), 0 0 24px rgba(255,47,146,.48); }
.gold-text { color: var(--gold); text-shadow: 0 0 18px rgba(255,217,138,.3); }
.soft-shadow { box-shadow: 0 18px 50px rgba(0,0,0,.35); }
.pink-shadow { box-shadow: 0 15px 45px rgba(255,47,146,.22); }
.gold-shadow { box-shadow: 0 15px 45px rgba(255,217,138,.15); }
.blur-backdrop { backdrop-filter: blur(16px) saturate(1.2); }
.rounded-soft { border-radius: 18px; }
.rounded-large { border-radius: 30px; }
.rounded-pill { border-radius: 999px; }

/* Responsywność dużych ekranów. */
@media (min-width: 1200px) {
    .photo-frame { width: min(480px, 36vw); height: min(680px, 86vh); }
    .envelope { transform: scale(1.04); }
}
@media (min-width: 1600px) {
    .photo-frame { width: min(520px, 34vw); height: min(740px, 88vh); }
}
@media (max-width: 700px) {
    :root { --frame-radius: 22px; }
    .photo-frame { width: 91vw; height: 82vh; height: 82svh; }
    .envelope { width: min(86vw, 360px); height: min(58vw, 240px); }
    .envelope-flap { border-left-width: min(43vw,180px); border-right-width: min(43vw,180px); border-top-width: min(35vw,137px); }
    .wax-seal { top: 42%; width: 62px; height: 62px; }
    .envelope-text { margin-top: 28px; font-size: .9rem; letter-spacing: .14em; }
    .mg-4 { right: 8%; }
    .mg-5 { right: 12%; }
}
@media (max-width: 420px) {
    .photo-frame { width: 93vw; height: 78vh; height: 78svh; border-radius: 19px; }
    .my-girl-text { font-size: clamp(1rem, 5vw, 2rem); }
    .mg-2 { font-size: 1.7rem; }
    .mg-6 { font-size: 1.9rem; }
}
@media (orientation: landscape) and (max-height: 620px) {
    .photo-frame { width: auto; height: 88vh; height: 88svh; aspect-ratio: 3 / 4; }
    .envelope { transform: scale(.76); }
    .envelope-text { margin-top: 8px; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    .photo-frame img.active { transform: none; }
}

    <script>

        const canvas = document.getElementById('bg-canvas');

        const ctx = canvas.getContext('2d');

        let particles = [];



        function resizeCanvas() {

            canvas.width = window.innerWidth;

            canvas.height = window.innerHeight;

        }

        window.addEventListener('resize', resizeCanvas);

        resizeCanvas();



        class Particle {

            constructor() {

                this.reset();

            }

            reset() {

                this.x = Math.random() * canvas.width;

                this.y = canvas.height + 50;

                this.size = Math.random() * 4 + 1;

                this.speedY = Math.random() * 1.5 + 0.5;

                this.speedX = (Math.random() - 0.5) * 0.8;

                this.opacity = Math.random() * 0.6 + 0.2;

                this.color = Math.random() > 0.3 ? '#ff69b4' : '#ffd700';

            }

            update() {

                this.y -= this.speedY;

                this.x += this.speedX;

                if (this.y < -50) {

                    this.reset();

                }

            }

            draw() {

                ctx.save();

                ctx.globalAlpha = this.opacity;

                ctx.fillStyle = this.color;

                ctx.shadowBlur = 10;

                ctx.shadowColor = this.color;

                ctx.beginPath();

                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);

                ctx.fill();

                ctx.restore();

            }

        }



        for (let i = 0; i < 70; i++) {

            const p = new Particle();

            p.y = Math.random() * canvas.height;

            particles.push(p);

        }



        function animateParticles() {

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {

                p.update();

                p.draw();

            });

            requestAnimationFrame(animateParticles);

        }

        animateParticles();



        let slideInterval;



        function openEnvelope() {

            const envelopeContainer = document.getElementById('envelope-container');

            const envelope = document.querySelector('.envelope');

            const mainScene = document.getElementById('main-scene');

            const audio = document.getElementById('bg-audio');



            envelope.classList.add('open');



            // Ustawienie startu piosenki na 50 sekundzie

            audio.currentTime = 47;



            audio.play().catch(error => {

                console.log("Autoodtwarzanie zablokowane:", error);

            });



            setTimeout(() => {

                envelopeContainer.style.opacity = '0';

                setTimeout(() => {

                    envelopeContainer.style.display = 'none';

                    mainScene.classList.add('visible');

                    startSlideshow();

                }, 600);

            }, 700);

        }



        function startSlideshow() {
            const images = Array.from(document.querySelectorAll('.photo-frame img'));
            let currentIndex = 0;

            startMyGirlTexts();

            // Każde zdjęcie jest pokazywane po kolei tylko raz.
            slideInterval = setInterval(() => {
                images[currentIndex].classList.remove('active');
                currentIndex++;

                if (currentIndex >= images.length) {
                    clearInterval(slideInterval);
                    setTimeout(showLoveFinale, 900);
                    return;
                }

                images[currentIndex].classList.add('active');
            }, 2000);
        }

        function showLoveFinale() {
            const scene = document.getElementById('main-scene');
            const finale = document.getElementById('love-finale');
            if (!scene || !finale) return;

            scene.classList.add('final-sequence');
            setTimeout(() => {
                finale.classList.add('show');
                finale.setAttribute('aria-hidden', 'false');
                createFinaleSparks(finale);
            }, 1050);
        }

        function createFinaleSparks(container) {
            const colors = [285, 295, 305, 315, 325, 335, 345, 265, 275];
            for (let i = 0; i < 72; i++) {
                const spark = document.createElement('span');
                const angle = Math.random() * Math.PI * 2;
                const distance = 120 + Math.random() * Math.max(window.innerWidth, window.innerHeight) * .72;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;
                spark.className = 'finale-spark';
                spark.style.setProperty('--size', `${3 + Math.random() * 11}px`);
                spark.style.setProperty('--hue', colors[Math.floor(Math.random() * colors.length)]);
                spark.style.setProperty('--dx', `${dx}px`);
                spark.style.setProperty('--dy', `${dy}px`);
                spark.style.setProperty('--duration', `${1.1 + Math.random() * 1.5}s`);
                container.appendChild(spark);
                spark.addEventListener('animationend', () => spark.remove(), { once: true });
            }
        }

        // Napisy najpierw pojawiaja sie wszystkie w losowej kolejnosci,
        // a pozniej cyklicznie wracaja w losowych miejscach.
        function startMyGirlTexts() {
            const frame = document.querySelector('.photo-frame');
            const texts = Array.from(document.querySelectorAll('.my-girl-text'));
            if (!frame || texts.length === 0) return;

            const shuffle = (items) => {
                const result = [...items];
                for (let i = result.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [result[i], result[j]] = [result[j], result[i]];
                }
                return result;
            };

            const showText = (element) => {
                const maxLeft = Math.max(8, frame.clientWidth - element.offsetWidth - 8);
                const maxTop = Math.max(8, frame.clientHeight - element.offsetHeight - 8);
                const left = 8 + Math.random() * Math.max(0, maxLeft - 8);
                const top = 8 + Math.random() * Math.max(0, maxTop - 8);

                element.style.left = `${Math.round(left)}px`;
                element.style.top = `${Math.round(top)}px`;
                element.style.right = 'auto';
                element.style.setProperty('--rot', `${Math.round(Math.random() * 16 - 8)}deg`);
                element.classList.remove('is-visible');
                void element.offsetWidth;
                element.classList.add('is-visible');
            };

            const firstRound = shuffle(texts);
            firstRound.forEach((element, index) => {
                setTimeout(() => showText(element), 500 + index * (650 + Math.random() * 550));
            });

            // Powtarzanie zaczyna sie dopiero po pierwszym pokazaniu wszystkich napisow.
            const firstRoundDuration = 500 + (texts.length - 1) * 1200 + 900;
            setTimeout(() => {
                setInterval(() => {
                    const element = texts[Math.floor(Math.random() * texts.length)];
                    showText(element);
                }, 900 + Math.random() * 1100);
            }, firstRoundDuration);
        }

    </script>

</body>
